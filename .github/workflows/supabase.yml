name: Deploy PRF to Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:
    inputs:
      record_existing_migrations:
        description: Record migrations 202611270001–202611270005 already applied in the production SQL Editor
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: prf-supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: '3.4.0'

      - name: Apply migrations and deploy functions
        env:
          SUPABASE_PROJECT_REF: crstiwhylwumglbjxwbo
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          RECORD_EXISTING_MIGRATIONS: ${{ inputs.record_existing_migrations }}
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD in GitHub Actions secrets."
            exit 1
          fi

          supabase link --project-ref "$SUPABASE_PROJECT_REF"

          if [[ "$RECORD_EXISTING_MIGRATIONS" == "true" ]]; then
            supabase db query --remote --read-only --file .github/scripts/verify-supabase-baseline.sql
            supabase migration repair 202611270001 202611270002 202611270003 202611270004 202611270005 --status applied --remote --yes
          fi

          supabase db push --remote --yes
          supabase functions deploy --remote="$SUPABASE_PROJECT_REF" --use-api --yes
